<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Singles</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <script>
        const isLocalhost = Boolean(
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname.startsWith('192.168.') ||
            window.location.hostname.startsWith('10.')
        );

        if ('serviceWorker' in navigator && !isLocalhost) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log("Service Worker registrado con éxito (Modo Producción)."))
                    .catch(err => console.log("Error al registrar Service Worker:", err));
            });
        }
    </script>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --text-muted: #aaa;
            --input-bg: #333; --border: #555; --hover: #2a2a2a;
        }
        body.light-mode {
            --bg: #f5f5f5; --panel: #ffffff; --text: #333; --text-muted: #666;
            --input-bg: #fff; --border: #ccc; --hover: #f0f0f0;
        }
        
        /* BLOQUEO DE ANCHO PARA EVITAR ZOOM OUT */
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); 
            padding: 20px; text-align: center; margin: 0; transition: background 0.3s, color 0.3s; 
            max-width: 100vw; overflow-x: hidden; box-sizing: border-box; 
        }
        
        #top-bar { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; position: relative; }
        
        h1.main-title { color: #4CAF50; margin: 0; cursor: pointer; user-select: none; transition: opacity 0.2s; }
        h1.main-title:hover { opacity: 0.8; }
        
        #agrupacionSelect, #regionColectiva { font-size: 1em; padding: 6px 12px; border-radius: 8px; font-weight: bold; background-color: #4CAF50; color: white; border: none; outline: none; cursor: pointer; }
        
        #theme-btn { position: absolute; right: 0; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1.2em; transition: 0.2s; }
        #theme-btn:hover { transform: scale(1.1); }
        @media (max-width: 768px) { #theme-btn { position: relative; right: auto; margin-left: auto; } #top-bar { justify-content: flex-start; } }

        .tab-container { display: flex; justify-content: center; margin-bottom: 20px; background: var(--panel); padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 5px; position: sticky; top: 0; z-index: 50; }
        #wcaIdPokedex, #wcaIdCompetidor { text-transform: uppercase; }
        .tab-btn { background-color: var(--input-bg); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; margin: 0; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .tab-btn:hover { background-color: var(--hover); }
        .tab-btn.active { background-color: #4CAF50; color: white; border-color: #4CAF50; }
        .tab-content { display: none; max-width: 100%; }
        .tab-content.active { display: block; }
        
        .controls { background: var(--panel); padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        input, select, button.action-btn { padding: 10px; margin: 5px; border-radius: 4px; border: 1px solid var(--border); font-size: 16px; background-color: var(--input-bg); color: var(--text); }
        
        button.btn-secondary { background-color: var(--input-bg); color: var(--text); border: 1px solid var(--border); transition: 0.2s; cursor: pointer; border-radius: 4px; }
        button.btn-secondary:hover { background-color: var(--hover); border-color: #4CAF50; }

        input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
        input:focus, select:focus { border-color: #4CAF50; outline: none; }
        button.action-btn { background-color: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.action-btn:hover { background-color: #45a049; }
        
        #btn-scrollTop {
            display: none; position: fixed; bottom: 20px; right: 20px; z-index: 99;
            font-size: 1.5em; font-weight: bold; border: none; outline: none;
            background-color: #4CAF50; color: white; cursor: pointer;
            width: 50px; height: 50px; border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: background-color 0.3s, transform 0.2s;
        }
        #btn-scrollTop:hover { background-color: #45a049; transform: scale(1.1); }

        .chips-container { margin-top: 10px; }
        .chip { display: inline-block; padding: 4px 10px; margin: 0 4px; background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: 16px; font-size: 0.8em; cursor: pointer; transition: 0.2s; }
        .chip:hover { background: #4CAF50; color: #fff; border-color: #4CAF50; }

        .opciones-extra { margin-top: 15px; font-size: 1em; color: var(--text-muted); }
        .opciones-extra input { transform: scale(1.3); margin-right: 8px; cursor: pointer; }
        .opciones-extra label { cursor: pointer; user-select: none; }

        .loading { color: #4CAF50; font-weight: bold; font-size: 1.2em; }
        .error { color: #f44336; font-weight: bold; }
        .stats { font-size: 1.2em; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; max-width: 1200px; margin: 0 auto; }
        .card { padding: 10px 5px; border-radius: 6px; font-weight: bold; font-size: 0.9em; text-align: center; cursor: pointer; transition: transform 0.1s; border: 2px solid transparent; }
        .card:active { transform: scale(0.95); }
        
        .got { background-color: #2e7d32; color: #fff; border: 2px solid #4CAF50; }
        .streak { background-color: #8e24aa; color: #fff; box-shadow: 0 0 10px rgba(142, 36, 170, 0.4); border: 2px solid #ab47bc; }
        .miss { background-color: var(--input-bg); color: var(--text-muted); border: 2px solid var(--border); }
        .bisagra { background-color: #d32f2f; color: #fff; border: 2px solid #b71c1c; box-shadow: 0 0 10px rgba(211, 47, 47, 0.6); }
        .got.strong { background-color: #154018; border: 2px solid #2e7d32; }
        .streak.strong { background-color: #4a148c; border: 2px solid #380b6e; }

        table { width: 100%; max-width: 1000px; margin: 0 auto; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #333; color: #4CAF50; }
        tr:hover { background-color: var(--hover); }
        
        .table-wrapper { width: 100%; max-width: 1000px; margin: 0 auto 20px auto; overflow-x: auto; border-radius: 8px; }
        .table-wrapper table { width: 100%; margin: 0; white-space: normal; }

        @media (max-width: 768px) {
            table { font-size: 0.75em; }
            th, td { padding: 8px 4px; }
            .rank-badges { line-height: 1.5; }
        }
        
        a { color: #64b5f6; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; color: #90caf9; }
        .profile-link { color: #4CAF50; font-size: 1.1em; transition: 0.2s; }
        .profile-link:hover { color: #81c784; }

        .rank-badges { white-space: nowrap; text-align: center; line-height: 1.8; }

        .clickable-cell { cursor: pointer; transition: background 0.2s; }
        .clickable-cell:hover { background-color: var(--hover) !important; }
        .link-rank { cursor: pointer; padding: 3px 6px; border-radius: 4px; transition: 0.2s; border: 1px solid transparent; }
        .link-rank:hover { background-color: #4CAF50; color: #fff; border: 1px solid #81c784; }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        #modal-box { background: var(--panel); padding: 25px; border-radius: 12px; border: 2px solid #4CAF50; max-width: 80%; max-height: 80vh; overflow-y: auto; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        #modal-texto { font-size: 1.2em; margin-bottom: 20px; line-height: 1.5; color: var(--text); }
        #modal-texto a { color: #ffd54f; display: block; margin: 5px 0; }
        #modal-texto a:hover { color: #ffe082; }
        .modal-btn { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1em; margin-top: 15px; }
        
        .fame-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 1.1em; text-align: left; transition: background 0.2s; }
        .fame-row:hover { background-color: var(--hover); }
        .fame-pos { font-weight: bold; color: #ce93d8; width: 40px; display: inline-block; }
    </style>
    <script data-goatcounter="https://venturamargri.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    
    <div id="top-bar">
        <h1 class="main-title" onclick="window.location.href = window.location.pathname" title="Volver al inicio">Pokédex Singles</h1>
        <select id="agrupacionSelect" onchange="cambiarAgrupacion()">
            <option value="individual" selected>Modo Individual</option>
            <option value="Nacional">Modo Nacional</option>
            <option value="Continental">Modo Continental</option>
            <option value="Mundial">Modo Mundial</option>
        </select>
        <select id="regionColectiva" style="display:none;" onchange="actualizarTodasLasPestanas()"></select>
        <button id="theme-btn" onclick="toggleTheme()" title="Modo Claro/Oscuro">☀️</button>
    </div>
    
    <div class="tab-container">
        <button id="btn-tab-pokedex" class="tab-btn active" onclick="openTab('tab-pokedex')">Pokédex de Singles</button>
        <button id="btn-tab-top1000" class="tab-btn" onclick="openTab('tab-top1000')">Rankings Globales</button>
        <button id="btn-tab-competidor" class="tab-btn" onclick="openTab('tab-competidor')">Rango por Competidor</button>
        <button id="btn-tab-fame" class="tab-btn" onclick="openTab('tab-fame')" style="display:none; background:#ffb300; color:#000; border-color:#ffb300;">🏆 Hall of Fame</button>
    </div>

    <div id="modal-overlay" onclick="cerrarPopUp()">
        <div id="modal-box" onclick="event.stopPropagation()">
            <div id="modal-texto"></div>
            <button class="modal-btn" onclick="cerrarPopUp()">Cerrar</button>
        </div>
    </div>

    <!-- PESTAÑA 1 -->
    <div id="tab-pokedex" class="tab-content active">
        <div class="controls">
            <div id="ctrl-individual" style="display:inline-block;">
                <input type="search" id="wcaIdPokedex" placeholder="WCA ID (Ej: 2014LOPE04)" onkeyup="manejarEnter(event, 'btnGenPokedex')">
            </div>

            <select id="eventIdPokedex" onchange="actualizarURL()">
                <option value="333" selected>3x3x3</option><option value="222">2x2x2</option><option value="444">4x4x4</option><option value="555">5x5x5</option><option value="666">6x6x6</option><option value="777">7x7x7</option><option value="333bf">3x3x3 Blindfolded</option><option value="333oh">3x3x3 One-Handed</option><option value="clock">Clock</option><option value="minx">Megaminx</option><option value="pyram">Pyraminx</option><option value="skewb">Skewb</option><option value="sq1">Square-1</option>
            </select>
            <button id="btnGenPokedex" class="action-btn" onclick="generarPokedex()">Generar Pokédex</button>
            <div class="chips-container" id="chips-pokedex"></div>
            
            <div class="opciones-extra" id="opciones-individuales">
                <input type="checkbox" id="checkBisagra" onchange="if(document.getElementById('resPokedex').innerHTML !== '') generarPokedex()">
                <label for="checkBisagra">Mostrar Tiempo Bisagra</label>
            </div>
        </div>
        <div id="resPokedex"></div>
    </div>

    <!-- PESTAÑA 2 -->
    <div id="tab-top1000" class="tab-content">
        <div class="controls">
            <select id="eventIdTop" onchange="actualizarURL()">
                <option value="333" selected>3x3x3</option><option value="222">2x2x2</option><option value="444">4x4x4</option><option value="555">5x5x5</option><option value="666">6x6x6</option><option value="777">7x7x7</option><option value="333bf">3x3x3 Blindfolded</option><option value="333oh">3x3x3 One-Handed</option><option value="clock">Clock</option><option value="minx">Megaminx</option><option value="pyram">Pyraminx</option><option value="skewb">Skewb</option><option value="sq1">Square-1</option><option value="444bf">4x4x4 Blindfolded</option><option value="555bf">5x5x5 Blindfolded</option>
            </select>
            <span id="filtros-ind-top">
                <select id="countryTop" onchange="filtrarTop()">
                    <option value="Todos" selected>Todos los resultados</option>
                    <optgroup label="--- Continentes ---" id="group-continents"></optgroup>
                    <optgroup label="--- Países ---" id="group-countries"></optgroup>
                </select>
            </span>
            <button class="action-btn" onclick="cargarTop1000()">Ver Ranking</button>
            <br>
            <input type="search" id="searchNameTop" placeholder="🔍 Filtrar por nombre o WCA ID" oninput="filtrarTop()" style="margin-top: 15px; width: 60%;">
        </div>
        <div id="resTop1000"></div>
    </div>

    <!-- PESTAÑA 3 -->
    <div id="tab-competidor" class="tab-content">
        <div class="controls">
            <span id="ctrl-ind-comp">
                <input type="search" id="wcaIdCompetidor" placeholder="WCA ID (Ej: 2014LOPE04)" onkeyup="manejarEnter(event, 'btnGenCompetidor')">
            </span>
            <button id="btnGenCompetidor" class="action-btn" onclick="cargarCompetidor()">Ver Todos los Rangos</button>
            <div class="chips-container" id="chips-competidor"></div>
        </div>
        <div id="resCompetidor"></div>
    </div>

    <!-- PESTAÑA 4 -->
    <div id="tab-fame" class="tab-content">
        <div class="controls" style="text-align: center;">
            <select id="eventIdFame" onchange="cargarHallOfFame()">
                <option value="333" selected>3x3x3</option><option value="222">2x2x2</option><option value="444">4x4x4</option><option value="555">5x5x5</option><option value="666">6x6x6</option><option value="777">7x7x7</option><option value="333bf">3x3x3 Blindfolded</option><option value="333oh">3x3x3 One-Handed</option><option value="clock">Clock</option><option value="minx">Megaminx</option><option value="pyram">Pyraminx</option><option value="skewb">Skewb</option><option value="sq1">Square-1</option>
            </select>
            <select id="fameTypeSelect" onchange="cargarHallOfFame()">
                <option value="individuals" id="fameOptIndiv">🏆 Por Individuos (Aportadores)</option>
                <option value="countries" id="fameOptCountries">🏆 Por Países</option>
                <option value="continents" id="fameOptContinents">🏆 Por Continentes</option>
            </select>
            <button class="action-btn" onclick="cargarHallOfFame()">Ver Hall of Fame</button>
        </div>
        <div id="resFame" style="max-width: 800px; margin: 0 auto; background: var(--panel); border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <p style="color:var(--text-muted);">Pulsa "Ver Hall of Fame" para cargar los datos.</p>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px; padding-bottom: 25px; font-size: 0.85em; color: var(--text-muted);">
        Última actualización de datos: <span id="fecha-update">Consultando...</span>
    </div>

    <button id="btn-scrollTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Volver arriba">↑</button>

    <script>
        const apiCache = new Map();
        let datosRankingGlobal = [];
        let renderLimit = 50; 
        let filtradosTop = [];
        let cargandoMas = false; 
        
        let filtradosFame = [];
        let renderLimitFame = 50;

        let statsColectivosActuales = null; 

        const wcaContinents = ["_Africa", "_Asia", "_Europe", "_North America", "_Oceania", "_South America"];
        const wcaCountries = ["Afghanistan", "Albania", "Algeria", "Andorra", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan", "Bahrain", "Bangladesh", "Belarus", "Belgium", "Bolivia", "Bosnia and Herzegovina", "Brazil", "Brunei", "Bulgaria", "Cambodia", "Canada", "Chile", "China", "Colombia", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czech Republic", "Denmark", "Dominican Republic", "Ecuador", "Egypt", "El Salvador", "Estonia", "Finland", "France", "Georgia", "Germany", "Greece", "Guatemala", "Honduras", "Hong Kong", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Korea", "Kuwait", "Kyrgyzstan", "Latvia", "Lebanon", "Liechtenstein", "Lithuania", "Luxembourg", "Macau", "Malaysia", "Malta", "Mauritius", "Mexico", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Myanmar", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Nigeria", "North Macedonia", "Norway", "Oman", "Pakistan", "Palestine", "Panama", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "San Marino", "Saudi Arabia", "Senegal", "Serbia", "Singapore", "Slovakia", "Slovenia", "South Africa", "Spain", "Sri Lanka", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Thailand", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan", "Venezuela", "Vietnam"];

        fetch('https://api.github.com/repos/venturamargri/pokedex-singles/commits?path=ranking_333.txt&per_page=1')
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    const fecha = new Date(data[0].commit.author.date);
                    const opciones = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                    document.getElementById('fecha-update').innerText = fecha.toLocaleDateString('es-ES', opciones);
                }
            }).catch(() => { document.getElementById('fecha-update').innerText = 'Desconocida'; });
        
        const grpCont = document.getElementById('group-continents');
        wcaContinents.forEach(c => { let opt = document.createElement('option'); opt.value = c; opt.textContent = c.replace('_', '🌍 '); grpCont.appendChild(opt); });
        const grpCoun = document.getElementById('group-countries');
        wcaCountries.forEach(p => { let opt = document.createElement('option'); opt.value = p; opt.textContent = p; grpCoun.appendChild(opt); });

        function cambiarAgrupacion() {
            const modo = document.getElementById('agrupacionSelect').value;
            const ctrlInd = document.getElementById('ctrl-individual');
            const ctrlIndComp = document.getElementById('ctrl-ind-comp');
            const filtrosIndTop = document.getElementById('filtros-ind-top');
            const regionSel = document.getElementById('regionColectiva');
            const btnFame = document.getElementById('btn-tab-fame');
            
            actualizarTodasLasPestanas();

            if (modo === 'individual') {
                ctrlInd.style.display = 'inline-block';
                ctrlIndComp.style.display = 'inline-block';
                filtrosIndTop.style.display = 'inline-block';
                regionSel.style.display = 'none';
                btnFame.style.display = 'none';
                document.getElementById('chips-pokedex').style.display = 'block';
                document.getElementById('chips-competidor').style.display = 'block';
                
                if(document.getElementById('tab-fame').classList.contains('active')) { openTab('tab-pokedex', false); }
            } else {
                ctrlInd.style.display = 'none';
                ctrlIndComp.style.display = 'none';
                filtrosIndTop.style.display = (modo === 'Nacional') ? 'inline-block' : 'none';
                document.getElementById('chips-pokedex').style.display = 'none';
                document.getElementById('chips-competidor').style.display = 'none';
                btnFame.style.display = 'block';
                
                regionSel.innerHTML = '';
                if (modo === 'Nacional') {
                    regionSel.style.display = 'inline-block';
                    wcaCountries.forEach(c => {
                        let opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                        if(c === "Spain") opt.selected = true;
                        regionSel.appendChild(opt);
                    });
                    document.getElementById('fameTypeSelect').value = 'individuals';
                    document.getElementById('fameOptCountries').style.display = 'none';
                    document.getElementById('fameOptContinents').style.display = 'none';
                } else if (modo === 'Continental') {
                    regionSel.style.display = 'inline-block';
                    wcaContinents.forEach(c => {
                        let opt = document.createElement('option'); opt.value = c; opt.textContent = c.replace('_', '🌍 ');
                        if(c === "_Europe") opt.selected = true;
                        regionSel.appendChild(opt);
                    });
                    document.getElementById('fameTypeSelect').value = 'individuals';
                    document.getElementById('fameOptCountries').style.display = 'block';
                    document.getElementById('fameOptContinents').style.display = 'none';
                } else if (modo === 'Mundial') {
                    regionSel.style.display = 'none'; 
                    document.getElementById('fameOptCountries').style.display = 'block';
                    document.getElementById('fameOptContinents').style.display = 'block';
                }
            }
        }

        function actualizarTodasLasPestanas() {
            document.getElementById('resPokedex').innerHTML = '';
            document.getElementById('resTop1000').innerHTML = '';
            document.getElementById('resCompetidor').innerHTML = '';
            document.getElementById('resFame').innerHTML = `<p style="color:var(--text-muted);">Pulsa "Ver Hall of Fame" para cargar los datos.</p>`;
            statsColectivosActuales = null;
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); document.getElementById('theme-btn').innerText = document.body.classList.contains('light-mode') ? '🌙' : '☀️'; }

        function openTab(tabName, shouldUpdateUrl = true) {
            if (!document.startViewTransition) { ejecutarCambioDePestana(tabName, shouldUpdateUrl); return; }
            document.startViewTransition(() => { ejecutarCambioDePestana(tabName, shouldUpdateUrl); });
        }
        
        function ejecutarCambioDePestana(tabName, shouldUpdateUrl) {
            Array.from(document.getElementsByClassName("tab-content")).forEach(el => el.classList.remove("active"));
            Array.from(document.getElementsByClassName("tab-btn")).forEach(el => el.classList.remove("active"));
            document.getElementById(tabName).classList.add("active");
            document.getElementById('btn-' + tabName).classList.add("active");
            if(shouldUpdateUrl) actualizarURL();
            document.getElementById('btn-scrollTop').style.display = 'none';
        }

        function actualizarURL(push = true) {
            const activeTabElement = document.querySelector('.tab-btn.active');
            if(!activeTabElement) return;
            const tab = activeTabElement.id.replace('btn-tab-', '');
            
            let wcaid = "", ev = "";
            if(tab === 'pokedex') { wcaid = document.getElementById('wcaIdPokedex').value; ev = document.getElementById('eventIdPokedex').value; }
            if(tab === 'top1000') { ev = document.getElementById('eventIdTop').value; }

        function calcularRachas(arrayTiempos) {
            if(arrayTiempos.length === 0) return null;
            let rachas = []; let rActual = {min: arrayTiempos[0], max: arrayTiempos[0]};
            for (let i = 1; i < arrayTiempos.length; i++) {
                if (arrayTiempos[i] === rActual.max + 1) rActual.max = arrayTiempos[i];
                else { rachas.push(rActual); rActual = {min: arrayTiempos[i], max: arrayTiempos[i]}; }
            }
            rachas.push(rActual);

            let mejorRacha = {min: -1, max: -1, rango: -1};
            for(let r of rachas) {
                let rng = r.max - r.min;
                if(rng > mejorRacha.rango) mejorRacha = {min: r.min, max: r.max, rango: rng};
            }
            return mejorRacha;
        }

        function calcularHingeTimesAvanzado(tiemposSet) {
            let arr = Array.from(tiemposSet).sort((a, b) => a - b);
            let rachas = []; let rActual = {min: arr[0], max: arr[0]};
            
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] === rActual.max + 1) rActual.max = arr[i];
                else { rachas.push(rActual); rActual = {min: arr[i], max: arr[i]}; }
            }
            rachas.push(rActual);
            
            let maxRangoActual = Math.max(...rachas.map(r => r.max - r.min));
            let bestRango = maxRangoActual; let hingeTimes = new Set();
            
            const evaluarCandidato = (v, hipoteticoRango) => {
                if (hipoteticoRango > bestRango) { bestRango = hipoteticoRango; hingeTimes.clear(); hingeTimes.add(v);
                } else if (hipoteticoRango === bestRango && hipoteticoRango > maxRangoActual) { hingeTimes.add(v); }
            };

            for (let r of rachas) { evaluarCandidato(r.min - 1, (r.max - r.min) + 1); evaluarCandidato(r.max + 1, (r.max - r.min) + 1); }
            for (let i = 0; i < rachas.length - 1; i++) {
                let r1 = rachas[i]; let r2 = rachas[i+1]; let gap = r2.min - r1.max - 1;
                if (gap === 1) { evaluarCandidato(r1.max + 1, (r1.max - r1.min) + (r2.max - r2.min) + 2); }
            }
            return { bestRango, hingeTimes, maxRangoActual };
        }

        async function fetchWCA(wcaId) {
            if(apiCache.has(wcaId)) return apiCache.get(wcaId);
            const [resResults, resPerson] = await Promise.all([
                fetch(`https://www.worldcubeassociation.org/api/v0/persons/${wcaId}/results`),
                fetch(`https://www.worldcubeassociation.org/api/v0/persons/${wcaId}`)
            ]);
            if(!resResults.ok || !resPerson.ok) throw new Error("No se pudo encontrar el WCA ID.");
            const data = await resResults.json(); const personData = await resPerson.json();
            const payload = { data, personName: personData.person.name }; apiCache.set(wcaId, payload);
            return payload;
        }

        async function generarPokedex() {
            const modo = document.getElementById('agrupacionSelect').value;
            const eventId = document.getElementById('eventIdPokedex').value;
            const resDiv = document.getElementById('resPokedex');
            const mostrarBisagra = document.getElementById('checkBisagra').checked;

            if (modo === 'individual') {
                const wcaId = document.getElementById('wcaIdPokedex').value.trim().toUpperCase();
                if(!wcaId) return; actualizarURL(); resDiv.innerHTML = "<p class='loading'>Conectando con la API WCA...</p>";

                try {
                    const { data, personName } = await fetchWCA(wcaId); guardarReciente(wcaId);
                    let tiemposConseguidos = new Map(); 
                    data.slice().reverse().forEach(comp => {
                        if(comp.event_id === eventId) {
                            let nombreComp = comp.competition_id;
                            if(comp.attempts) { comp.attempts.forEach(i => { if(i > 0) { if(!tiemposConseguidos.has(i)) tiemposConseguidos.set(i, new Set()); tiemposConseguidos.get(i).add(nombreComp); } }); }
                            if(comp.best > 0) { if(!tiemposConseguidos.has(comp.best)) tiemposConseguidos.set(comp.best, new Set()); tiemposConseguidos.get(comp.best).add(nombreComp); }
                        }
                    });

                    if(tiemposConseguidos.size === 0) { resDiv.innerHTML = `<p class='error'>No hay marcas oficiales para ${personName} (${wcaId}) en esta categoría.</p>`; return; }

                    const arrayTiempos = Array.from(tiemposConseguidos.keys()).sort((a, b) => a - b);
                    const racha = calcularRachas(arrayTiempos);
                    const minVal = arrayTiempos[0], maxVal = arrayTiempos[arrayTiempos.length - 1];
                    const totalPosibles = maxVal - minVal + 1;
                    const porcentaje = ((tiemposConseguidos.size / totalPosibles) * 100).toFixed(1);
                    const nombreEvento = document.getElementById('eventIdPokedex').options[document.getElementById('eventIdPokedex').selectedIndex].text;
                    const antirrango = maxVal - minVal;

                    let hingeTimes = new Set(); let affectedTimes = new Set();

                    if (mostrarBisagra) {
                        let bestPotentialRango = racha.rango;
                        for (let v = minVal; v <= maxVal; v++) {
                            if (!tiemposConseguidos.has(v)) {
                                let simArray = [...arrayTiempos, v].sort((a,b) => a-b);
                                let simRacha = calcularRachas(simArray);
                                if (simRacha.rango > bestPotentialRango) { bestPotentialRango = simRacha.rango; hingeTimes.clear(); hingeTimes.add(v);
                                } else if (simRacha.rango === bestPotentialRango && simRacha.rango > racha.rango) { hingeTimes.add(v); }
                            }
                        }
                        for (let h of hingeTimes) {
                            let left = h; while(tiemposConseguidos.has(left - 1)) left--; let right = h; while(tiemposConseguidos.has(right + 1)) right++;
                            for (let a = left; a <= right; a++) { if (a !== h) affectedTimes.add(a); }
                        }
                    }

                    let statsHtml = `
                        <div class="stats">
                            <div style="margin-bottom: 8px;">
                                <a href="https://www.worldcubeassociation.org/persons/${wcaId}" target="_blank" class="profile-link" title="Ver perfil oficial WCA">${personName} (${wcaId})</a>
                                <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.7em; margin-left: 10px;" onclick="irACompetidor('${wcaId}')" title="Ver todos los rangos">📊</button>
                            </div>
                            <strong>Evento:</strong> ${nombreEvento}<br>
                            <strong>Completado:</strong> ${tiemposConseguidos.size} / ${totalPosibles} (${porcentaje}%) <br>

                            <div style="margin-top: 5px;">
                                <strong>Rango:</strong> <span style="color: #ce93d8;">${formatCS(racha.rango)}s (${formatCS(racha.min)} - ${formatCS(racha.max)})</span>

                            </div>
                        </div>
                        <div class="grid">`;

                    for(let v = minVal; v <= maxVal; v++) {
                        let tv = formatCS(v);
                        let isBisagra = hingeTimes.has(v); let isAffected = affectedTimes.has(v);
                        let compsArray = tiemposConseguidos.has(v) ? Array.from(tiemposConseguidos.get(v)) : [];
                        let compsStrData = compsArray.join(','); let tooltipMsg = compsArray.join(', ');

                        let tooltip = tiemposConseguidos.has(v) ? `title="${tooltipMsg}"` : `title="No conseguido"`;
                        let accionClick = tiemposConseguidos.has(v) ? `onclick="mostrarPopUp('${compsStrData}', '${tv}')"` : `onclick="mostrarPopUpFallo('${tv}')"`;
                        
                        let cssClass = 'miss';
                        if (isBisagra) { cssClass = 'bisagra'; } else if (v >= racha.min && v <= racha.max) { cssClass = isAffected ? 'streak strong' : 'streak'; } else if (tiemposConseguidos.has(v)) { cssClass = isAffected ? 'got strong' : 'got'; }
                        let scrollClass = (v === racha.min) ? ` inicio-rango` : "";
                        
                        statsHtml += `<div class='card ${cssClass}${scrollClass}' ${tooltip} ${accionClick}>${tv}</div>`;
                    }
                    resDiv.innerHTML = statsHtml + `</div>`;
                } catch(error) { resDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`; }
                
            } else {
                resDiv.innerHTML = `<p class='loading'>Consultando archivos de la comunidad...</p>`;

                    const req = await fetch(`collective_${eventId}.json?v=${Date.now()}`);
                    if (!req.ok) throw new Error("Aún no hay datos colectivos subidos por Python para este evento.");
                    const data = await req.json();
                    
                    let statsRegion; let nombreRegion = "";
                    if (modo === 'Mundial') {
                        statsRegion = data['Mundial']; nombreRegion = "el Mundo";
                    } else if (modo === 'Continental' || modo === 'Nacional') {
                        const seleccion = document.getElementById('regionColectiva').value;
                        statsRegion = data[modo][seleccion]; nombreRegion = seleccion.replace('_','');
                        if(!statsRegion) throw new Error(`No se han indexado datos para ${nombreRegion} en esta categoría.`);
                    }

                    statsColectivosActuales = statsRegion; 
                    const tiemposObj = statsRegion.tiempos;
                    const arrayTiempos = Object.keys(tiemposObj).map(Number).sort((a,b) => a-b);
                    
                    if (arrayTiempos.length === 0) throw new Error("No hay tiempos registrados en esta región.");
                    
                    const minVal = arrayTiempos[0], maxVal = arrayTiempos[arrayTiempos.length - 1];
                    const totalPosibles = maxVal - minVal + 1;
                    const rachaCol = calcularRachas(arrayTiempos);
                    
                    let hingeTimes = new Set(); let affectedTimes = new Set();

                    if (mostrarBisagra) {
                        let bestPotentialRango = rachaCol.rango; let tiemposConseguidos = new Set(arrayTiempos);
                        for (let v = minVal; v <= maxVal; v++) {
                            if (!tiemposConseguidos.has(v)) {
                                let simArray = [...arrayTiempos, v].sort((a,b) => a-b);
                                let simRacha = calcularRachas(simArray);
                                if (simRacha.rango > bestPotentialRango) { bestPotentialRango = simRacha.rango; hingeTimes.clear(); hingeTimes.add(v);
                                } else if (simRacha.rango === bestPotentialRango && simRacha.rango > rachaCol.rango) { hingeTimes.add(v); }
                            }
                        }
                        for (let h of hingeTimes) {
                            let left = h; while(tiemposConseguidos.has(left - 1)) left--; let right = h; while(tiemposConseguidos.has(right + 1)) right++;
                            for (let a = left; a <= right; a++) { if (a !== h) affectedTimes.add(a); }
                        }
                    }

                    let statsHtml = `
                        <div class="stats">
                            <h2 style="margin:0 0 10px 0; color:#4CAF50;">Pokédex de ${nombreRegion}</h2>
                            <strong>Completado:</strong> ${arrayTiempos.length} / ${totalPosibles} (${((arrayTiempos.length / totalPosibles) * 100).toFixed(1)}%) <br>
                            <strong>Rango Colectivo:</strong> <span style="color: #ce93d8;">${formatCS(rachaCol.rango)}s (${formatCS(rachaCol.min)} - ${formatCS(rachaCol.max)})</span>
                            <div style="margin-top: 5px;">
                                <button class="action-btn" style="padding: 4px 10px; font-size: 0.8em; margin-left: 10px;" onclick="scrollToRango()">Mostrar Rango</button>
                                <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8em; margin-left: 5px;" onclick="mostrarHistorialBisagrasColectivo()">📖 Historial</button>
                            </div>
                        </div>
                        <div class="grid">`;

                    for(let v = minVal; v <= maxVal; v++) {
                        let tv = formatCS(v);
                        let isBisagra = hingeTimes.has(v); let isAffected = affectedTimes.has(v);
                        
                        if (tiemposObj[v]) {
                            let obj = tiemposObj[v];
                            let descStr = JSON.stringify(obj.descubridores).replace(/"/g, '&quot;');
                            let compStr = JSON.stringify(obj.comps).replace(/"/g, '&quot;');
                            
                            let cssClass = 'got';
                            if (v >= rachaCol.min && v <= rachaCol.max) { cssClass = isAffected ? 'streak strong' : 'streak'; } else { cssClass = isAffected ? 'got strong' : 'got'; }
                            let scrollClass = (v === rachaCol.min) ? ` inicio-rango` : "";
                            
                            statsHtml += `<div class='card ${cssClass}${scrollClass}' onclick="mostrarPopUpColectivo('${tv}', ${descStr}, ${compStr})">${tv}</div>`;
                        } else {
                            let cssClass = isBisagra ? 'bisagra' : 'miss';
                            statsHtml += `<div class='card ${cssClass}' onclick="document.getElementById('modal-texto').innerHTML='<h2 style=\\'margin:0 0 10px 0; color:var(--text);\\'>${tv}</h2>❌ Nadie en ${nombreRegion} ha logrado este tiempo jamás.'; document.getElementById('modal-overlay').style.display='flex';">${tv}</div>`;
                        }
                    }
                    resDiv.innerHTML = statsHtml + `</div>`;

                } catch (err) { resDiv.innerHTML = `<p class='error'>Error: ${err.message}</p>`; }
            }
        }

        function scrollToRango() {

        async function cargarTop1000() {
            const modo = document.getElementById('agrupacionSelect').value;
            const eventId = document.getElementById('eventIdTop').value;
            const resDiv = document.getElementById('resTop1000');
            actualizarURL();
            
            if (modo === 'Mundial') { resDiv.innerHTML = `<p class='error'>El modo Mundial no tiene divisiones internas para comparar rangos en esta pestaña.</p>`; return; }

            if (modo === 'individual') {
                resDiv.innerHTML = `<p class='loading'>Cargando ranking individual...</p>`;
                try {
                    const response = await fetch(`ranking_${eventId}.txt?v=${Date.now()}`);
                    if(!response.ok) throw new Error(`Ranking no disponible`);
                    const text = await response.text();
                    datosRankingGlobal = [];
                    const regex = /^(\d+)\.\s+(.*?)\s+\(([A-Z0-9]+)\.\s+(.*?)\.\s+(.*?)\)\s+-\s+([0-9.]+)s\s+\((.*?)\)/i;

                    text.split('\n').forEach(line => {
                        let match = line.trim().match(regex);
                        if(match) datosRankingGlobal.push({ posGlobal: match[1], nombre: match[2], wcaId: match[3], pais: match[4], continente: match[5], rangoText: match[6], rangoLimites: match[7] });
                    });
                    
                    if(datosRankingGlobal.length === 0) throw new Error("Error en el formato del TXT.");
                    filtrarTop();
                } catch(error) { resDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`; }
            } else {
                resDiv.innerHTML = `<p class='loading'>Calculando rankings de la región...</p>`;
                try {
                    const req = await fetch(`collective_${eventId}.json?v=${Date.now()}`);
                    if (!req.ok) throw new Error("No hay datos colectivos.");
                    const data = await req.json();
                    
                    datosRankingGlobal = [];
                    if (modo === 'Nacional') {
                        for (let p in data.Nacional) {
                            let obj = data.Nacional[p];
                            let arr = Object.keys(obj.tiempos).map(Number).sort((a,b)=>a-b);
                            let r = calcularRachas(arr);
                            if(r) datosRankingGlobal.push({ nombre: p, wcaId: "-", pais: p, continente: data.Metadata.paises_continentes[p], rangoText: (r.rango/100).toFixed(2), rangoLimites: `${(r.min/100).toFixed(2)}-${(r.max/100).toFixed(2)}`, rawRango: r.rango });
                        }
                    } else if (modo === 'Continental') {
                        for (let c in data.Continental) {
                            let obj = data.Continental[c];
                            let arr = Object.keys(obj.tiempos).map(Number).sort((a,b)=>a-b);
                            let r = calcularRachas(arr);
                            if(r) datosRankingGlobal.push({ nombre: c.replace('_','🌍 '), wcaId: "-", pais: "-", continente: c, rangoText: (r.rango/100).toFixed(2), rangoLimites: `${(r.min/100).toFixed(2)}-${(r.max/100).toFixed(2)}`, rawRango: r.rango });
                        }
                    }
                    
                    datosRankingGlobal.sort((a,b) => b.rawRango - a.rawRango);
                    datosRankingGlobal.forEach((d, i) => d.posGlobal = i + 1);
                    filtrarTop();
                } catch(error) { resDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`; }
            }
        }

        function filtrarTop() {
            const modo = document.getElementById('agrupacionSelect').value;
            const paisFiltro = (modo === 'individual' || modo === 'Nacional') ? document.getElementById('countryTop').value : "Todos";
            const searchVal = document.getElementById('searchNameTop').value.toLowerCase().trim();
            
            let filtradosRegion = datosRankingGlobal;
            
            if ((modo === 'individual' || modo === 'Nacional') && paisFiltro !== "Todos") {
                if(paisFiltro.startsWith('_')) {
                    filtradosRegion = filtradosRegion.filter(d => d.continente === paisFiltro);
                } else {
                    filtradosRegion = filtradosRegion.filter(d => d.pais === paisFiltro);
                }
            }
            
            let current_nat_rank = 1; let last_rango_val = -1;
            filtradosRegion.forEach((d, i) => {
                let rVal = parseFloat(d.rangoText);
                if (rVal !== last_rango_val) { current_nat_rank = i + 1; last_rango_val = rVal; }
                d.posLocalCalc = current_nat_rank; 
            });
            
            filtradosTop = filtradosRegion;
            if (searchVal) { filtradosTop = filtradosTop.filter(d => d.nombre.toLowerCase().includes(searchVal) || (d.wcaId && d.wcaId.toLowerCase().includes(searchVal))); }

            renderLimit = (modo === 'individual') ? 50 : 9999; 
            pintarTablaTop();
        }

                        if (modo === 'Nacional') {
                            let contCode = data.Metadata.paises_continentes[seleccion];
                            rankBadge += ` <br> <span class="link-rank" onclick="irARanking('${ev}', '${contCode}')" title="Ir al Ranking del Continente">🗺️ #${rankCont}</span>`;
                        }

                        tableHtml += `
                            <tr>
                                <td class="clickable-cell" onclick="irAPokedexColectiva('${modo}', '${seleccion}', '${ev}')" style="font-weight:bold; text-transform:uppercase; color: #64b5f6;">${ev}</td>
                                <td class="clickable-cell" onclick="irAPokedexColectiva('${modo}', '${seleccion}', '${ev}')">
                                    <span style="color:#ce93d8; font-weight:bold;">${formatCS(racha.rango)}s</span> 
                                    <span style="font-size:0.8em; color:var(--text-muted);">(${formatCS(racha.min)} - ${formatCS(racha.max)})</span>
                                </td>
                                <td class="rank-badges" style="font-size:1.1em; font-weight:bold;">${rankBadge}</td>
                            </tr>`;
                    });
                    
                    if (!hayDatos) throw new Error("No hay datos cruzados para mostrar.");
                    resDiv.innerHTML = tableHtml + `</table></div>`;
                } catch(error) { resDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`; }
            }
        }

        async function cargarHallOfFame() {
            const modo = document.getElementById('agrupacionSelect').value;
            const ev = document.getElementById('eventIdFame').value;
            const tipoFama = document.getElementById('fameTypeSelect').value;
            const resDiv = document.getElementById('resFame');
            
            resDiv.innerHTML = "<p class='loading'>Cargando Hall of Fame...</p>";
            try {
                const req = await fetch(`collective_${ev}.json?v=${Date.now()}`);
                if(!req.ok) throw new Error("Datos no disponibles");
                const data = await req.json();
                
                let region = modo === 'Mundial' ? 'Mundial' : document.getElementById('regionColectiva').value;
                let dataset = modo === 'Mundial' ? data.Mundial : data[modo][region];
                
                statsColectivosActuales = dataset; 
                
                let fameObj = dataset[`hall_of_fame_${tipoFama}`];
                if(!fameObj || Object.keys(fameObj).length === 0) return resDiv.innerHTML = "<p class='error'>Sin descubridores aún.</p>";
                
                filtradosFame = [];
                for(let [nombre, puntos] of Object.entries(fameObj)) { filtradosFame.push({nombre, puntos}); }
                
                renderLimitFame = 50;
                pintarFame();
            } catch(e) { resDiv.innerHTML = `<p class='error'>Error: ${e.message}</p>`; }
        }

        function pintarFame() {
            const resDiv = document.getElementById('resFame');
            const modo = document.getElementById('agrupacionSelect').value;
            const ev = document.getElementById('eventIdFame').value;
            const tipoFama = document.getElementById('fameTypeSelect').value;
            let region = modo === 'Mundial' ? 'Mundial' : document.getElementById('regionColectiva').value;
            
            let icono = tipoFama === 'individuals' ? '👤' : (tipoFama === 'countries' ? '📍' : '🌍');
            let html = `<h2 style="color:#ffb300; margin-top:0;">🏆 Top Descubridores en ${region.replace('_','')}</h2>`;
            
            let limit = Math.min(renderLimitFame, filtradosFame.length);
            let lastPoints = -1; let tiePos = 1;
            
            for(let i=0; i < limit; i++) {
                let item = filtradosFame[i];
                let actualPos = i + 1;
                if (item.puntos !== lastPoints) { tiePos = actualPos; lastPoints = item.puntos; }
                
                let nameDisplay = item.nombre;
                let safeName = encodeURIComponent(item.nombre);
                
                let btnAportes = "";
                
                if (tipoFama === 'individuals') {
                    let match = item.nombre.match(/(.*)\s+\((.*?)\)/);
                    if (match) {
                        let wcaId = match[2];
                        nameDisplay = `<a href="javascript:void(0)" onclick="irAPokedex('${wcaId}', '${ev}')" style="color:var(--text); text-decoration:none;" class="clickable-cell" title="Ver Pokédex individual">${match[1]} <span style="color:#64b5f6;">(${wcaId})</span></a>
                        <button class="btn-secondary" style="padding: 2px 6px; font-size: 0.7em; margin-left: 10px;" onclick="irACompetidor('${wcaId}')" title="Ver perfil competidor">📊</button>`;
                        
                        btnAportes = `<div style="color:#4CAF50; font-weight:bold; cursor:pointer;" onclick="mostrarAportesPopUp('${safeName}')" title="Ver lista de aportes en detalle">${item.puntos} singles 🔍</div>`;
                    }
                } else if (tipoFama === 'countries') {
                    nameDisplay = `<a href="javascript:void(0)" onclick="irAPokedexColectiva('Nacional', '${item.nombre}', '${ev}')" style="color:var(--text); text-decoration:none;" class="clickable-cell" title="Ver Pokédex de ${item.nombre}">${item.nombre}</a>`;
                    btnAportes = `<div style="color:#4CAF50; font-weight:bold;">${item.puntos} singles</div>`;
                } else if (tipoFama === 'continents') {
                    nameDisplay = `<a href="javascript:void(0)" onclick="irAPokedexColectiva('Continental', '${item.nombre}', '${ev}')" style="color:var(--text); text-decoration:none;" class="clickable-cell" title="Ver Pokédex de ${item.nombre.replace('_','')}">${item.nombre.replace('_','🌍 ')}</a>`;
                    btnAportes = `<div style="color:#4CAF50; font-weight:bold;">${item.puntos} singles</div>`;
                }

                html += `
                    <div class="fame-row">
                        <div><span class="fame-pos">#${tiePos}</span> ${icono} ${nameDisplay}</div>
                        ${btnAportes}
                    </div>`;
            }
            
            if (renderLimitFame < filtradosFame.length) { html += `<p style="color:var(--text-muted); margin-top:20px;">↓ Haz scroll para cargar más ↓</p>`; }
            resDiv.innerHTML = html;
        }
    </script>
</body>
</html>
